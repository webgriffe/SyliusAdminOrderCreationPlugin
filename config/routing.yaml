sylius_admin_order_creation_select_order_customer:
    path: /admin/orders/new/select-customer
    methods: [GET]
    defaults:
        _controller: Webgriffe\SyliusAdminOrderCreationPlugin\Controller\SelectNewOrderCustomerAction

sylius_admin_order_creation_customer_create:
    path: /admin/orders/new/customer/{customerEmail}/{channelCode}
    methods: [GET]
    options:
        expose: true
    defaults:
        _controller: Webgriffe\SyliusAdminOrderCreationPlugin\Controller\CustomerCreationAction

sylius_admin_order_creation_order_create:
    path: /admin/orders/new/{customerId}/{channelCode}
    methods: [GET]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order::createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: '@WebgriffeSyliusAdminOrderCreationPlugin/order/create.html.twig'
            form:
                type: Webgriffe\SyliusAdminOrderCreationPlugin\Form\Type\NewOrderType
            factory:
                method: ['expr:service("Webgriffe\\SyliusAdminOrderCreationPlugin\\Factory\\OrderFactory")', 'createForCustomerAndChannel']
                arguments: [$customerId, $channelCode]
    requirements:
        customerId: \d+

sylius_admin_order_creation_order_preview:
    path: /admin/orders/new/{customerId}/{channelCode}/preview
    methods: [POST]
    defaults:
        _controller: Webgriffe\SyliusAdminOrderCreationPlugin\Controller\OrderPreviewAction
        _sylius:
            form:
                type: Webgriffe\SyliusAdminOrderCreationPlugin\Form\Type\NewOrderType
            factory:
                method: ['expr:service("Webgriffe\\SyliusAdminOrderCreationPlugin\\Factory\\OrderFactory")', 'createForCustomerAndChannel']
                arguments: [$customerId, $channelCode]

sylius_admin_order_creation_order_create_from_preview:
    path: /admin/orders/new/{customerId}/{channelCode}/create-from-preview
    methods: [POST]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order::createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: '@WebgriffeSyliusAdminOrderCreationPlugin/order/preview.html.twig'
            form:
                type: Webgriffe\SyliusAdminOrderCreationPlugin\Form\Type\NewOrderType
            factory:
                method: ['expr:service("Webgriffe\\SyliusAdminOrderCreationPlugin\\Factory\\OrderFactory")', 'createForCustomerAndChannel']
                arguments: [$customerId, $channelCode]

sylius_admin_order_creation_order_create_back:
    path: /admin/orders/edit/{customerId}/{channelCode}
    methods: [POST]
    options:
        expose: true
    defaults:
        _controller: Webgriffe\SyliusAdminOrderCreationPlugin\Controller\OrderCreateAction
    requirements:
        customerId: \d+

sylius_admin_order_creation_reorder:
    path: /admin/orders/{id}/reorder
    methods: [GET]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order::createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: '@WebgriffeSyliusAdminOrderCreationPlugin/order/create.html.twig'
            form:
                type: Webgriffe\SyliusAdminOrderCreationPlugin\Form\Type\NewOrderType
            factory:
                method: ['expr:service("Webgriffe\\SyliusAdminOrderCreationPlugin\\Factory\\OrderFactory")', 'createFromExistingOrder']
                arguments: ["expr:service('sylius.repository.order').find($id)"]
